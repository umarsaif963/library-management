<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Borrowing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Library System</h1>
            <p>Search and borrow books</p>
        </header>

        <section class="book-catalog">
            <h2>Available Books</h2>
            <div id="bookList" class="book-grid"></div>
        </section>

        <section class="borrow-section">
            <h2>Borrow a Book</h2>
            <div class="input-group">
                <input type="text" id="bookInput" placeholder="Enter book name (physics, computer, math, science)">
                <button id="borrowBtn" onclick="borrowBook()">Borrow</button>
            </div>
            <div id="message" class="message"></div>
        </section>

        <section class="status-section">
            <h2>Borrowed Books</h2>
            <div id="borrowedList" class="borrowed-grid"></div>
        </section>
    </div>

    <div id="confirmModal" class="modal hidden">
        <div class="modal-content">
            <p id="modalText">Book is available. Do you want to borrow this book?</p>
            <div class="modal-actions">
                <button id="modalCancel" class="btn-secondary">Cancel</button>
                <button id="modalConfirm" class="btn-primary">Yes, Borrow</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
